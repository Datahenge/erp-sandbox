# One Redis container, three logical databases (decision #6): 0 cache,
# 1 queue, 2 socketio. Production uses three separate containers; this
# deliberately does not.
#
# The port is supplied on the command line from config.toml, so it is not set
# here -- there is no second place for it to disagree.

# Nothing in here is worth keeping across a restart. The cache rebuilds, the
# queues refill, and socketio state is per-connection. Persistence would buy
# nothing and cost fork pauses.
save ""
appendonly no

# Bound to every interface *inside the container*. The container network is the
# boundary, and the port is never published to the host (decision #16).
bind 0.0.0.0
protected-mode no

# Evict cache entries rather than returning errors when memory runs short.
maxmemory-policy allkeys-lru

loglevel notice
